<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>웹 타로 카드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0d1a;
      --panel: #1b1830;
      --accent: #c9a96e;
      --text: #efe8da;
      --muted: #9088a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #2a2350 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    header { max-width: 980px; margin: 0 auto 1.5rem; }
    header h1 { margin: 0 0 0.25rem; font-size: 1.8rem; letter-spacing: 0.02em; }
    header p { margin: 0; color: var(--muted); }

    .controls {
      max-width: 980px;
      margin: 0 auto 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .controls button {
      background: var(--panel);
      border: 1px solid #2e2949;
      color: var(--text);
      padding: 0.7rem 1.1rem;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.05s;
    }
    .controls button:hover:not(:disabled) { border-color: var(--accent); }
    .controls button:active:not(:disabled) { transform: translateY(1px); }
    .controls button:disabled { opacity: 0.5; cursor: progress; }

    main { max-width: 980px; margin: 0 auto; }

    .spread-title { font-size: 1.1rem; color: var(--accent); margin: 0 0 1rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid #2e2949;
      border-radius: 0.8rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card .position-label {
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .card img {
      width: 100%;
      max-width: 200px;
      height: auto;
      border-radius: 0.4rem;
      transition: transform 0.4s ease;
    }
    .card.reversed img { transform: rotate(180deg); }
    .card .name { margin: 0.8rem 0 0.2rem; font-weight: 600; }
    .card .name-en { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
    .card .orientation {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      border: 1px solid #3a3460;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }
    .card .orientation.reversed { color: #d59b9b; border-color: #6e3a3a; }
    .card .keywords { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
    .card .keywords span {
      background: #25213d;
      color: var(--text);
      font-size: 0.78rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
      border: 1px dashed #2e2949;
      border-radius: 0.8rem;
    }

    .json-panel {
      max-width: 980px;
      margin: 2rem auto 0;
      background: #0a0814;
      border: 1px solid #2e2949;
      border-radius: 0.6rem;
      padding: 1rem;
    }
    .json-panel summary { cursor: pointer; color: var(--muted); }
    .json-panel pre {
      margin: 0.8rem 0 0;
      white-space: pre-wrap;
      word-break: break-all;
      color: #b5acca;
      font-size: 0.8rem;
    }

    footer { max-width: 980px; margin: 3rem auto 0; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>웹 타로 카드</h1>
    <p>Rider-Waite (Roses &amp; Lilies) 덱으로 카드를 뽑아 보세요. API 없이 정적 파일만으로 동작합니다.</p>
  </header>

  <div class="controls" id="controls">
    <button data-action="single" disabled>1장 뽑기</button>
    <button data-action="three_card" disabled>과거-현재-미래 (3장)</button>
    <button data-action="situation_action_outcome" disabled>상황-행동-결과 (3장)</button>
  </div>

  <main>
    <h2 class="spread-title" id="spread-title"></h2>
    <div class="cards" id="cards">
      <div class="empty">위 버튼을 눌러 카드를 뽑아보세요.</div>
    </div>
    <details class="json-panel">
      <summary>응답 JSON 보기</summary>
      <pre id="json-out">{}</pre>
    </details>
  </main>

  <footer>
    카드 이미지: <a href="https://commons.wikimedia.org/wiki/Category:Rider-Waite_tarot_deck_(Roses_%26_Lilies)" target="_blank" rel="noopener">Wikimedia Commons — Rider-Waite (Roses &amp; Lilies)</a> · Public domain
  </footer>

  <script type="module">
    import { Tarot } from './tarot.js';

    const $controls = document.getElementById('controls');
    const $cards = document.getElementById('cards');
    const $title = document.getElementById('spread-title');
    const $json = document.getElementById('json-out');

    const tarot = await Tarot.load();
    $controls.querySelectorAll('button').forEach((b) => (b.disabled = false));

    $controls.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const result = action === 'single' ? tarot.draw(1) : tarot.drawSpread(action);
      render(action, result);
    });

    function render(action, result) {
      $cards.innerHTML = '';
      let cards;
      if (action === 'single') {
        $title.textContent = '1장 뽑기 · 지금';
        cards = [{ name_ko: '지금', card: result[0] }];
      } else {
        $title.textContent = `${result.name_ko} — ${result.description_ko ?? ''}`;
        cards = result.positions.map((p) => ({ name_ko: p.name_ko, card: p.card }));
      }
      for (const { name_ko, card } of cards) {
        $cards.appendChild(buildCardElement(name_ko, card));
      }
      $json.textContent = JSON.stringify(result, null, 2);
    }

    function buildCardElement(positionLabel, card) {
      const el = document.createElement('div');
      el.className = `card ${card.orientation === 'reversed' ? 'reversed' : ''}`;
      el.innerHTML = `
        <div class="position-label">${escapeHtml(positionLabel)}</div>
        <img src="${escapeAttr(card.image_url)}" alt="${escapeAttr(card.name_en)}" />
        <div class="name">${escapeHtml(card.name_ko)}</div>
        <div class="name-en">${escapeHtml(card.name_en)}</div>
        <div class="orientation ${card.orientation}">${card.orientation === 'reversed' ? '역방향' : '정방향'}</div>
        <div class="keywords">${card.keywords.map((k) => `<span>${escapeHtml(k)}</span>`).join('')}</div>
      `;
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
  </script>
</body>
</html>
